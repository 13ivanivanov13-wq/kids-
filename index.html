<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Alfabeto — gioco delle lettere italiane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7EA;
    --ink:#2D2A4A;
    --coral:#FF6B6B;
    --sun:#FFD23F;
    --sky:#3FBFB2;
    --grass:#8BC34A;
    --card-shadow: 0 10px 0 rgba(45,42,74,0.12), 0 18px 30px rgba(45,42,74,0.14);
    --radius: 28px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,210,63,0.35), transparent 40%),
      radial-gradient(circle at 90% 15%, rgba(63,191,178,0.30), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(255,107,107,0.20), transparent 50%),
      var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:18px 14px 34px;
  }
  h1,h2,h3,.display{font-family:'Fredoka', sans-serif; margin:0;}
  .app{width:100%; max-width:480px; display:flex; flex-direction:column; gap:14px;}

  .topbar{display:flex; align-items:center; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .badge{
    font-size:28px; width:48px; height:48px; border-radius:16px;
    background:var(--sun); display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 0 rgba(45,42,74,0.18);
  }
  .brand .title{font-size:19px; font-weight:600; letter-spacing:0.2px;}
  .brand .subtitle{font-size:11.5px; color:#6b6690; font-weight:700; text-transform:uppercase; letter-spacing:1px;}

  .stars-counter{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    background:#fff; border-radius:999px; padding:7px 14px 7px 10px;
    box-shadow:0 4px 0 rgba(45,42,74,0.10);
    font-weight:800; font-size:15px;
  }

  .progress-wrap{
    background:#fff; border-radius:999px; padding:5px; box-shadow: inset 0 2px 4px rgba(45,42,74,0.08);
  }
  .progress-track{
    position:relative; height:14px; border-radius:999px; background:#EFE9D9; overflow:hidden;
  }
  .progress-fill{
    position:absolute; inset:0; width:0%; border-radius:999px;
    background:linear-gradient(90deg, var(--sun), var(--coral));
    transition:width .6s cubic-bezier(.34,1.56,.64,1);
  }
  .progress-label{text-align:center; font-size:12.5px; font-weight:800; color:#847f9f; margin-top:6px;}

  .stage{
    background:#fff; border-radius:var(--radius); padding:22px 20px 24px;
    box-shadow:var(--card-shadow);
    min-height:420px;
    max-height:calc(100vh - 150px);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    position:relative; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }

  .mascot-row{display:flex; align-items:flex-end; gap:10px; width:100%; margin-bottom:10px;}
  .mascot{
    font-size:44px; line-height:1; flex-shrink:0;
    animation: bob 2.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.15));
  }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-7px) rotate(3deg);} }
  .mascot.happy{ animation: jump .5s ease-in-out 3; }
  @keyframes jump{ 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-16px) scale(1.08);} }
  .mascot.oops{ animation: shake .4s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px) rotate(-5deg);} 75%{transform:translateX(8px) rotate(5deg);} }

  .bubble{
    background:#F4F1FF; border-radius:16px 16px 16px 4px; padding:10px 14px;
    font-weight:700; font-size:14.5px; color:var(--ink); flex:1;
    box-shadow: 0 3px 0 rgba(45,42,74,0.08);
  }

  .stage-body{width:100%; display:flex; flex-direction:column; align-items:center; gap:16px; flex:1; justify-content:center;}

  .letter-card{
    width:180px; height:180px; border-radius:32px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka'; font-weight:700; font-size:82px;
    color:#fff; text-shadow:0 4px 0 rgba(0,0,0,0.12);
    box-shadow: var(--card-shadow);
    animation: pop .5s cubic-bezier(.34,1.56,.64,1);
    user-select:none;
  }
  .letter-card small{font-size:56px; margin-left:6px; font-weight:600;}
  @keyframes pop{ 0%{transform:scale(0.4) rotate(-8deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;} }

  .word-emoji{font-size:96px; animation: pop .5s cubic-bezier(.34,1.56,.64,1);}
  .word-text{font-family:'Fredoka'; font-size:26px; font-weight:600;}

  .btn{
    border:none; cursor:pointer; font-family:'Fredoka'; font-weight:600; font-size:16px;
    border-radius:16px; padding:14px 26px; color:#fff; background:var(--coral);
    box-shadow:0 5px 0 #d94f4f; transition:transform .08s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 #d94f4f;}
  .btn.secondary{background:var(--sky); box-shadow:0 5px 0 #2b968c;}
  .btn.ghost{background:#F4F1FF; color:var(--ink); box-shadow:0 5px 0 #d9d4f5;}
  .btn.wide{width:100%;}
  .btn-row{display:flex; gap:10px; width:100%;}

  .options-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%;}
  .option-card{
    border-radius:20px; padding:18px 10px; text-align:center; cursor:pointer;
    font-family:'Fredoka'; font-weight:700; font-size:40px; color:#fff;
    box-shadow:0 6px 0 rgba(45,42,74,0.18); border:none; transition:transform .1s;
  }
  .option-card:active{transform:scale(0.94);}
  .option-card.correct-flash{animation: correctPulse .5s ease;}
  .option-card.wrong-flash{animation: shake .4s ease; opacity:0.55;}
  @keyframes correctPulse{ 0%{transform:scale(1);} 50%{transform:scale(1.12);} 100%{transform:scale(1);} }

  .game-prompt{font-family:'Fredoka'; font-size:19px; font-weight:600; text-align:center;}
  .emoji-prompt{font-size:70px;}

  .reward-star{font-size:100px; animation: starPop .6s cubic-bezier(.34,1.56,.64,1);}
  @keyframes starPop{ 0%{transform:scale(0) rotate(-40deg); opacity:0;} 60%{transform:scale(1.3) rotate(10deg);} 100%{transform:scale(1) rotate(0); opacity:1;} }
  .reward-text{font-family:'Fredoka'; font-size:20px; font-weight:600;}

  .welcome-mascot{font-size:100px; animation: bob 2.6s ease-in-out infinite;}
  .welcome-title{font-size:26px; text-align:center; line-height:1.2;}
  .welcome-sub{color:#8b86a8; font-weight:700; text-align:center; font-size:14.5px; padding:0 6px;}
  .name-input{
    width:100%; border:2px solid #EFE9D9; border-radius:14px; padding:12px 16px;
    font-family:'Nunito', sans-serif; font-size:15px; font-weight:700; color:var(--ink);
    text-align:center; outline:none; background:#FBF9F2;
  }
  .name-input:focus{border-color:var(--sky);}
  .audio-test{
    background:none; border:2px dashed #C9C2E8; border-radius:14px; padding:10px 14px;
    font-family:'Nunito'; font-weight:800; font-size:13px; color:#6b6690; cursor:pointer;
  }
  .audio-status{font-size:12px; font-weight:800; color:#8b86a8; text-align:center; min-height:16px;}

  .train-scroll{width:100%; overflow-x:auto; padding:10px 0 6px;}
  .train{display:flex; align-items:flex-end; gap:6px; padding:0 4px;}
  .engine{font-size:44px; flex-shrink:0; margin-right:2px;}
  .car{
    flex-shrink:0; width:52px; height:60px; border-radius:12px 12px 6px 6px;
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-family:'Fredoka'; font-weight:700; font-size:20px; cursor:pointer;
    box-shadow:0 4px 0 rgba(45,42,74,0.18); border:none; position:relative;
  }
  .car::after{content:''; position:absolute; bottom:-8px; left:8px; width:10px; height:10px; border-radius:50%; background:#2D2A4A;}
  .car::before{content:''; position:absolute; bottom:-8px; right:8px; width:10px; height:10px; border-radius:50%; background:#2D2A4A;}
  .friends-gallery{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:100%;}
  .friend{font-size:26px; background:#F4F1FF; border-radius:12px; padding:6px 9px;}

  .certificate{
    width:100%; border-radius:22px; padding:22px 18px; text-align:center;
    background:linear-gradient(160deg, #FFF3D6, #FFE8B8);
    border:3px dashed #E8B93E;
  }
  .certificate-retry{
    background:linear-gradient(160deg, #F4F1FF, #EAE4FF);
    border:3px dashed #C9BFF0;
  }
  .certificate-medal{font-size:54px; animation: starPop .6s cubic-bezier(.34,1.56,.64,1);}
  .certificate-title{font-family:'Fredoka'; font-size:19px; font-weight:600; margin-top:4px;}
  .certificate-phrase-it{font-family:'Fredoka'; font-size:16px; font-weight:600; color:var(--ink); margin-top:10px;}
  .certificate-stats{margin-top:12px; font-weight:800; font-size:14px; color:var(--ink);}

  .footer-note{text-align:center; font-size:11.5px; color:#b3aecf; font-weight:700; padding:2px 10px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="badge">🇮🇹</div>
      <div>
        <div class="title">Alfabeto</div>
        <div class="subtitle">Alfabeto italiano</div>
      </div>
    </div>
    <div class="stars-counter">⭐ <span id="starCount">0</span></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="progress-label" id="progressLabel">Hai imparato 0 lettere su 21!</div>

  <div class="stage" id="stage"></div>

  <div class="footer-note">Tocca 🔊 per ascoltare di nuovo il suono</div>
</div>

<script>
// ---------- data ----------
const LETTERS = [
  {ch:'A', lo:'a', name:'a',      word:'albero',   emoji:'🌳', color:'#7CB342'},
  {ch:'B', lo:'b', name:'bi',     word:'banana',   emoji:'🍌', color:'#F5B301'},
  {ch:'C', lo:'c', name:'ci',     word:'cane',     emoji:'🐶', color:'#FF8A3D'},
  {ch:'D', lo:'d', name:'di',     word:'dolce',    emoji:'🍰', color:'#FF7AA2'},
  {ch:'E', lo:'e', name:'e',      word:'elefante', emoji:'🐘', color:'#8D93A6'},
  {ch:'F', lo:'f', name:'effe',   word:'fiore',    emoji:'🌸', color:'#A374DB'},
  {ch:'G', lo:'g', name:'gi',     word:'gatto',    emoji:'🐱', color:'#A9744F'},
  {ch:'H', lo:'h', name:'acca',   word:'hotel',    emoji:'🏨', color:'#4FB3D9'},
  {ch:'I', lo:'i', name:'i',      word:'isola',    emoji:'🏝️', color:'#3E8EDE'},
  {ch:'L', lo:'l', name:'elle',   word:'latte',    emoji:'🥛', color:'#B7AE9A'},
  {ch:'M', lo:'m', name:'emme',   word:'medico',   emoji:'🩺', color:'#E4574C'},
  {ch:'N', lo:'n', name:'enne',   word:'negozio',  emoji:'🏪', color:'#28C1CE'},
  {ch:'O', lo:'o', name:'o',      word:'orologio', emoji:'⏰', color:'#F5A623'},
  {ch:'P', lo:'p', name:'pi',     word:'pesce',    emoji:'🐟', color:'#9C4DCC'},
  {ch:'Q', lo:'q', name:'cu',     word:'quadro',   emoji:'🖼️', color:'#E0C22E'},
  {ch:'R', lo:'r', name:'erre',   word:'rana',     emoji:'🐸', color:'#5CA042'},
  {ch:'S', lo:'s', name:'esse',   word:'sole',     emoji:'☀️', color:'#F2B705'},
  {ch:'T', lo:'t', name:'ti',     word:'tigre',    emoji:'🐯', color:'#F0632D'},
  {ch:'U', lo:'u', name:'u',      word:'uovo',     emoji:'🥚', color:'#9AA0AC'},
  {ch:'V', lo:'v', name:'vi',     word:'vela',     emoji:'⛵', color:'#3E7FE0'},
  {ch:'Z', lo:'z', name:'zeta',   word:'zebra',    emoji:'🦓', color:'#3B4A54'},
];

const MASCOT = '🐱';
const state = { index: 0, stars: 0, stage: 'welcome', playerName: '', correctFirstTry: 0 };

const stageEl = document.getElementById('stage');
const starCountEl = document.getElementById('starCount');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function updateProgress(){
  starCountEl.textContent = state.stars;
  const pct = Math.round((state.index / LETTERS.length) * 100);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = state.index >= LETTERS.length
    ? 'Hai imparato tutte le 21 lettere! Bravo! 🎉'
    : `Hai imparato ${state.index} lettere su ${LETTERS.length}!`;
}

// ---------- speech ----------
const SPEECH_OK = typeof window !== 'undefined' && !!window.speechSynthesis;
let voicesList = [];
function loadVoices(){
  if(!SPEECH_OK) return;
  voicesList = window.speechSynthesis.getVoices() || [];
}
if(SPEECH_OK){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(lang){
  if(!voicesList.length) loadVoices();
  if(!voicesList.length) return null;
  const short = (lang || 'it-IT').slice(0,2).toLowerCase();
  return voicesList.find(v => v.lang && v.lang.toLowerCase().startsWith(short))
      || voicesList.find(v => v.lang && v.lang.toLowerCase().startsWith('it'))
      || null;
}

let audioWarned = false;
function showAudioWarning(msg){
  const note = document.getElementById('audioStatus') || document.querySelector('.footer-note');
  if(note) note.textContent = msg;
  audioWarned = true;
}

function speak(text, lang){
  if(!SPEECH_OK){
    showAudioWarning('La sintesi vocale non è supportata da questo browser. Prova ad aprire il file in Chrome o Safari.');
    return;
  }
  try{
    const synth = window.speechSynthesis;
    if(synth.speaking || synth.pending) synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'it-IT';
    u.rate = 0.85;
    u.pitch = 1.05;
    u.volume = 1;
    const v = pickVoice(lang);
    if(v) u.voice = v;
    u.onerror = () => {
      showAudioWarning('Il suono non è disponibile qui. Apri il file .html direttamente nel browser (Chrome/Safari) con una connessione a Internet.');
    };
    u.onstart = () => {
      const note = document.getElementById('audioStatus');
      if(note && !audioWarned) note.textContent = '';
    };
    synth.speak(u);
  }catch(e){
    showAudioWarning('Il suono non è disponibile in questo browser.');
  }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickOptions(correct){
  const others = shuffle(LETTERS.filter(l => l.ch !== correct.ch)).slice(0, 3);
  return shuffle([correct, ...others]);
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

// ---------- screens ----------
function render(){
  stageEl.innerHTML = '';
  if(state.stage === 'welcome') return renderWelcome();
  if(state.stage === 'intro') return renderIntro();
  if(state.stage === 'word') return renderWord();
  if(state.stage === 'game') return renderGame();
  if(state.stage === 'reward') return renderReward();
  if(state.stage === 'final') return renderFinal();
}

function renderWelcome(){
  stageEl.innerHTML = `
    <div class="stage-body">
      <div class="welcome-mascot">${MASCOT}</div>
      <div class="welcome-title">Ciao! Sono Gatto —<br>il tuo amico di viaggio!</div>
      <div class="welcome-sub">Impareremo insieme tutte le lettere dell'alfabeto italiano. Pronto? Andiamo!</div>
      <input type="text" id="nameInput" class="name-input" placeholder="Come ti chiami? (facoltativo)" maxlength="20" value="${escapeHtml(state.playerName)}">
      <button class="btn wide" id="startBtn">Inizia il gioco 🚀</button>
      <button class="audio-test" id="audioTestBtn">🔊 Prova il suono</button>
      <div class="audio-status" id="audioStatus"></div>
    </div>`;
  document.getElementById('startBtn').onclick = () => {
    const val = document.getElementById('nameInput').value.trim();
    state.playerName = val;
    state.index = 0;
    state.stars = 0;
    state.correctFirstTry = 0;
    state.stage = 'intro';
    render();
  };
  document.getElementById('audioTestBtn').onclick = () => {
    const note = document.getElementById('audioStatus');
    if(note) note.textContent = 'In ascolto...';
    speak('Ciao! Io sono Gatto!', 'it-IT');
  };
}

function renderIntro(){
  const L = LETTERS[state.index];
  stageEl.innerHTML = `
    <div class="mascot-row">
      <div class="mascot" id="mascot">${MASCOT}</div>
      <div class="bubble">Questa è la lettera ${cap(L.name)}! ${L.name}, ${L.name}, ${L.name} — come ${L.word}!</div>
    </div>
    <div class="stage-body">
      <div class="letter-card" style="background:${L.color}" id="letterCard">${L.ch}<small>${L.lo}</small></div>
      <div class="btn-row">
        <button class="btn secondary" id="repeatBtn">🔊 Ripeti</button>
      </div>
      <button class="btn wide" id="nextBtn">Avanti →</button>
    </div>`;
  document.getElementById('letterCard').onclick = () => speak(L.name, 'it-IT');
  document.getElementById('repeatBtn').onclick = () => speak(L.name, 'it-IT');
  document.getElementById('nextBtn').onclick = () => { state.stage = 'word'; render(); };
  speak(L.name, 'it-IT');
}

function renderWord(){
  const L = LETTERS[state.index];
  stageEl.innerHTML = `
    <div class="mascot-row">
      <div class="mascot" id="mascot">${MASCOT}</div>
      <div class="bubble">${cap(L.ch)} — come «${L.word}»! Che bello!</div>
    </div>
    <div class="stage-body">
      <div class="word-emoji" id="wordEmoji">${L.emoji}</div>
      <div class="word-text">${L.word}</div>
      <div class="btn-row">
        <button class="btn secondary" id="repeatBtn">🔊 Ascolta</button>
      </div>
      <button class="btn wide" id="nextBtn">Gioca →</button>
    </div>`;
  document.getElementById('wordEmoji').onclick = () => speak(L.word, 'it-IT');
  document.getElementById('repeatBtn').onclick = () => speak(L.word, 'it-IT');
  document.getElementById('nextBtn').onclick = () => { state.stage = 'game'; state.attempts = 0; render(); };
  speak(L.word, 'it-IT');
}

let gameType = 'find';
function renderGame(){
  const L = LETTERS[state.index];
  gameType = state.index % 2 === 0 ? 'find' : 'assemble';
  const options = pickOptions(L);

  if(gameType === 'find'){
    stageEl.innerHTML = `
      <div class="mascot-row">
        <div class="mascot" id="mascot">${MASCOT}</div>
        <div class="bubble">Trova la lettera ${cap(L.ch)}! 🔍</div>
      </div>
      <div class="stage-body">
        <div class="game-prompt">Quale carta è la lettera «${cap(L.name)}»?</div>
        <div class="btn-row">
          <button class="btn secondary" id="repeatBtn">🔊 Ripeti</button>
        </div>
        <div class="options-grid" id="optionsGrid">
          ${options.map(o => `<button class="option-card" style="background:${o.color}" data-ch="${o.ch}">${o.ch}</button>`).join('')}
        </div>
      </div>`;
    speak(L.name, 'it-IT');
  } else {
    stageEl.innerHTML = `
      <div class="mascot-row">
        <div class="mascot" id="mascot">${MASCOT}</div>
        <div class="bubble">Costruisci la parola! Trova la prima lettera 🧩</div>
      </div>
      <div class="stage-body">
        <div class="emoji-prompt">${L.emoji}</div>
        <div class="game-prompt">Con quale lettera inizia «${L.word}»?</div>
        <div class="btn-row">
          <button class="btn secondary" id="repeatBtn">🔊 Ripeti</button>
        </div>
        <div class="options-grid" id="optionsGrid">
          ${options.map(o => `<button class="option-card" style="background:${o.color}" data-ch="${o.ch}">${o.ch}</button>`).join('')}
        </div>
      </div>`;
    speak(L.word, 'it-IT');
  }

  const repeatBtn = document.getElementById('repeatBtn');
  if(repeatBtn) repeatBtn.onclick = () => speak(gameType === 'find' ? L.name : L.word, 'it-IT');

  document.querySelectorAll('.option-card').forEach(btn => {
    btn.onclick = () => handleAnswer(btn, btn.dataset.ch === L.ch, L);
  });
}

function handleAnswer(btn, isCorrect, L){
  const mascot = document.getElementById('mascot');
  if(isCorrect){
    btn.classList.add('correct-flash');
    mascot.classList.add('happy');
    speak(L.name, 'it-IT');
    if((state.attempts || 0) === 0) state.correctFirstTry += 1;
    setTimeout(() => { state.stage = 'reward'; render(); }, 550);
  } else {
    btn.classList.add('wrong-flash');
    mascot.classList.add('oops');
    state.attempts = (state.attempts || 0) + 1;
    const bubble = document.querySelector('.bubble');
    if(bubble){
      bubble.textContent = state.attempts >= 2
        ? `Non preoccuparti! Si dice «${L.name}». Riprova!`
        : 'Quasi! Riprova, ti do un piccolo aiuto 😊';
    }
    setTimeout(() => mascot.classList.remove('oops'), 400);
  }
}

function renderReward(){
  state.index += 1;
  state.stars += 1;
  updateProgress();
  const done = state.index >= LETTERS.length;
  stageEl.innerHTML = `
    <div class="stage-body">
      <div class="reward-star">⭐</div>
      <div class="reward-text">Ottimo lavoro! +1 stella!</div>
      <div class="welcome-sub">${done ? "Hai imparato tutte le lettere! È ora di cantare la canzoncina dell'alfabeto!" : 'Pronto per la prossima lettera?'}</div>
      <button class="btn wide" id="continueBtn">${done ? 'Canta la canzoncina 🎵' : 'Prossima lettera →'}</button>
    </div>`;
  document.getElementById('continueBtn').onclick = () => {
    state.stage = done ? 'final' : 'intro';
    render();
  };
}

function renderFinal(){
  const total = LETTERS.length;
  const percent = Math.round((state.correctFirstTry / total) * 100);
  const passed = percent > 40;
  const name = state.playerName ? escapeHtml(state.playerName) : '';
  const greetingName = name ? `, ${name}` : '';

  const certificateHtml = passed ? `
      <div class="certificate">
        <div class="certificate-medal">🏅</div>
        <div class="certificate-title">Certificato${name ? ' per ' + name : ''}</div>
        <div class="certificate-phrase-it">Complimenti! Hai completato il livello con successo!</div>
        <div class="certificate-stats">⭐ ${state.stars} stelle · ${percent}% di risposte corrette</div>
      </div>` : `
      <div class="certificate certificate-retry">
        <div class="certificate-medal">🌱</div>
        <div class="certificate-title">Quasi fatto!</div>
        <div class="certificate-phrase-it">Hai superato il ${percent}% delle lettere al primo tentativo. Riprova — la medaglia sarà presto tua!</div>
      </div>`;

  stageEl.innerHTML = `
    <div class="mascot-row">
      <div class="mascot happy">${MASCOT}</div>
      <div class="bubble">Bravissimo${greetingName}! Hai imparato tutto l'alfabeto! Cantiamo insieme — tocca i vagoncini!</div>
    </div>
    <div class="stage-body">
      <div class="train-scroll">
        <div class="train">
          <div class="engine">🚂${MASCOT}</div>
          ${LETTERS.map(L => `<button class="car" style="background:${L.color}" data-ch="${L.ch}">${L.ch}</button>`).join('')}
        </div>
      </div>
      <div class="game-prompt">I tuoi amici dell'alfabeto:</div>
      <div class="friends-gallery">
        ${LETTERS.map(L => `<div class="friend">${L.emoji}</div>`).join('')}
      </div>
      ${certificateHtml}
      <button class="btn wide" id="restartBtn">Gioca di nuovo</button>
    </div>`;
  document.querySelectorAll('.car').forEach(car => {
    car.onclick = () => {
      const L = LETTERS.find(l => l.ch === car.dataset.ch);
      speak(`${L.name}. ${L.word}`, 'it-IT');
    };
  });
  document.getElementById('restartBtn').onclick = () => {
    state.index = 0; state.stars = 0; state.correctFirstTry = 0; state.stage = 'welcome';
    updateProgress();
    render();
  };
  if(passed) speak('Complimenti! Hai completato il livello con successo!', 'it-IT');
}

updateProgress();
render();
</script>
</body>
</html>
